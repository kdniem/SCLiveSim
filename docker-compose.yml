# `docker compose up` starts PostgreSQL, the engine, the API, the webhook worker
# and the example control tower. The engine autostarts the `wholesale`
# simulation at 1440x (one simulated day per minute). Runs of the DataCo replay
# download the dataset (96 MB, CC BY 4.0) into ./data/raw on first use.
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-livesim}:${POSTGRES_PASSWORD:-livesim}@db:5432/${POSTGRES_DB:-livesim}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livesim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livesim}
      POSTGRES_DB: ${POSTGRES_DB:-livesim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  engine:
    build: .
    command: ["python", "-m", "engine"]
    environment:
      <<: *app-env
      LIVESIM_AUTOSTART: ${LIVESIM_AUTOSTART-wholesale}
      LIVESIM_AUTOSTART_TIME_FACTOR: ${LIVESIM_AUTOSTART_TIME_FACTOR:-1440}
      LIVESIM_AUTOSTART_SEED: ${LIVESIM_AUTOSTART_SEED:-42}
      DATACO_AUTO_DOWNLOAD: ${DATACO_AUTO_DOWNLOAD:-true}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  webhooks:
    build: .
    command: ["python", "-m", "api.webhooks"]
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  control-tower:
    build: .
    command: ["python", "-m", "http.server", "8080", "--directory", "examples/control-tower"]
    ports:
      - "${CONTROL_TOWER_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  pgdata:
